name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  PROJECT_DIR: ${{secrets.ROOT_PROJECTS_DIR}}/${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 20m
          script_stop: true
          script: |
            set -e

            PROJECT_DIR="${{ env.PROJECT_DIR }}"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📦 Cloning repository..."
              mkdir -p "$(dirname "$PROJECT_DIR")"
              git clone git@github.com:${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            echo "🔄 Updating code..."
            git fetch origin master
            git reset --hard origin/master
            git clean -fd

            echo "📝 Deployed commit:"
            git log -1 --oneline

            echo "🚀 Restarting containers..."
            podman-compose down --timeout 30 || true
            podman image prune -f || true
            podman-compose up -d --build --remove-orphans

            sleep 5
            podman-compose ps

            echo "✅ Deployment complete"

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Time (UTC):** $(date -u)" >> $GITHUB_STEP_SUMMARY
